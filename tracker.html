<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Membership Tracker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0052a3; }
        .status { margin-top: 16px; padding: 12px; border-radius: 4px; display: none; text-align: center; }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.loading { background: #e2e3e5; color: #383d41; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Log Membership Payment</h2>
        <form id="paymentForm">
            <label for="name">Customer Name</label>
            <input type="text" id="name" name="name" required placeholder="e.g., John Doe">

            <label for="amount">Monthly Amount</label>
            <input type="number" id="amount" name="amount" required placeholder="e.g., 50">

            <label for="date">Date of Payment</label>
            <input type="date" id="date" name="date" required>

            <button type="submit" id="submitBtn">Log Payment</button>
            <div id="statusMessage" class="status"></div>
        </form>
    </div>

    <script>
        // PASTE YOUR NEW GOOGLE APPS SCRIPT WEB APP URL HERE
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqQjbalpLi_parH45QWNzlA0IqCYNQW2F5fu-UyDojCdYYglfkaYjAkdE7T-IiLYk1ZA/exec"; 

        document.getElementById("paymentForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const btn = document.getElementById("submitBtn");
            const status = document.getElementById("statusMessage");
            const form = document.getElementById("paymentForm");
            const formData = new FormData(form);

            btn.disabled = true;
            btn.innerText = "Saving...";
            status.className = "status loading";
            status.innerText = "Syncing with Club Membership Sheet...";

            fetch(SCRIPT_URL, {
                method: "POST",
                body: formData
            })
            .then(response => {
                btn.disabled = false;
                btn.innerText = "Log Payment";
                status.className = "status success";
                status.innerText = "Payment logged successfully!";
                
                // Keep the date but clear the name and amount for the next entry
                document.getElementById("name").value = "";
                document.getElementById("amount").value = "";
                
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            })
            .catch(error => {
                btn.disabled = false;
                btn.innerText = "Log Payment";
                status.className = "status success"; 
                status.innerText = "Payment logged successfully!"; 
                document.getElementById("name").value = "";
                document.getElementById("amount").value = "";
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            });
        });
    </script>
</body>
</html>
